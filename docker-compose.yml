services:
  pocketbase:
    image: adrianmusante/pocketbase
    container_name: skillshelf-pocketbase
    restart: unless-stopped
    ports:
      - '8090:8090'
    volumes:
      - ./pocketbase/pb_data:/pocketbase/data
      - ./pocketbase/pb_migrations:/pocketbase/migrations
      # - ./pocketbase/public:/pocketbase/public
      # - ./pocketbase/hooks:/pocketbase/hooks
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:8090/api/health']
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skillshelf-frontend
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      # Copy env.example to .env and modify to your needs
      - POCKETBASE_URL=http://pocketbase:8090
      - PUBLIC_POCKETBASE_URL=${PUBLIC_POCKETBASE_URL}
      - ORIGIN=${ORIGIN}
    depends_on:
      pocketbase:
        condition: service_healthy
